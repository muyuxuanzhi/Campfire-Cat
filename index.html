<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c12;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}

<div id="ui-root">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ═════ 渲染 ═════ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.42;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x6b4a6e, 0.0125);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 220);
camera.position.set(15, 12.5, -16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0.6);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 8; controls.maxDistance = 46;
controls.maxPolarAngle = Math.PI * 0.487;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.26, 0.80, 0.92));
composer.addPass(new OutputPass());

/* ═════ 夜空 IBL + 穹顶 + 月亮 ═════ */
const RN = Math.random, rr = (a, b) => a + RN() * (b - a);
/* 安全护栏：Canvas ellipse 不接受负半径，统一钳制 */
(() => {
  const C = CanvasRenderingContext2D.prototype, orig = C.ellipse;
  C.ellipse = function (x, y, rx, ry, ...rest) {
    return orig.call(this, x, y, Math.max(0, rx || 0), Math.max(0, ry || 0), ...rest);
  };
  const oa = C.arc;
  C.arc = function (x, y, r, ...rest) { return oa.call(this, x, y, Math.max(0, r || 0), ...rest); };
})();
function T(w, h, draw, rx = 1, ry = 1, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function sp(g, w, h, n, a, b, o1 = .02, o2 = .1, s1 = 1, s2 = 3) {
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${RN() > .5 ? a : b},${rr(o1, o2).toFixed(3)})`; g.fillRect(RN() * w, RN() * h, rr(s1, s2), rr(s1, s2)); }
}
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const t = T(32, 256, (g) => {
    const l = g.createLinearGradient(0, 0, 0, 256);
    l.addColorStop(0, '#3a2a5c'); l.addColorStop(.36, '#6b4477'); l.addColorStop(.58, '#a85f6a');
    l.addColorStop(.78, '#e08a4a'); l.addColorStop(1, '#f0a85c');
    g.fillStyle = l; g.fillRect(0, 0, 32, 256);
  });
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(t).texture;
  scene.environmentIntensity = 1.35;
}
{
  const t = T(64, 320, (g, w, h) => {
    const l = g.createLinearGradient(0, 0, 0, h);
    l.addColorStop(0, '#2a1f45'); l.addColorStop(.24, '#4a2f66'); l.addColorStop(.44, '#7d4874');
    l.addColorStop(.62, '#b96a5e'); l.addColorStop(.78, '#e59352'); l.addColorStop(.9, '#f5b567');
    l.addColorStop(1, '#c98a52');
    g.fillStyle = l; g.fillRect(0, 0, w, h);
    /* 高空稀疏星点（黄昏初现） */
    for (let i = 0; i < 46; i++) { g.fillStyle = `rgba(255,238,214,${rr(.08, .3).toFixed(2)})`; g.fillRect(RN() * w, RN() * 70, 1, 1); }
    /* 横向暖云带 */
    for (let i = 0; i < 26; i++) {
      const y = rr(h * .42, h * .84);
      g.fillStyle = `rgba(${~~rr(240, 255)},${~~rr(160, 205)},${~~rr(110, 150)},${rr(.04, .12).toFixed(3)})`;
      g.fillRect(0, y, w, rr(2, 9));
    }
    for (let i = 0; i < 18; i++) {
      const y = rr(h * .3, h * .62);
      g.fillStyle = `rgba(${~~rr(120, 170)},${~~rr(80, 120)},${~~rr(140, 180)},${rr(.05, .13).toFixed(3)})`;
      g.fillRect(0, y, w, rr(3, 11));
    }
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(98, 32, 20), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false }));
  scene.add(dome);
}
const TX_HALO = T(128, 128, (g) => {
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.3, 'rgba(255,255,255,.4)');
  r.addColorStop(.68, 'rgba(255,255,255,.11)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
});
{
  /* 落日：暖橘圆盘 + 大范围霞光 */
  const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: TX_HALO, color: 0xffb765, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  sun.scale.set(22, 22, 1); sun.position.set(-40, 13, 54); scene.add(sun);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TX_HALO, color: 0xff7a4a, transparent: true, opacity: .34, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  glow.scale.set(62, 46, 1); glow.position.set(-40, 11, 53); scene.add(glow);
}

/* ═════ 程序化 PBR 贴图 ═════ */
function woodTex(base, dark, rx = 2, ry = 1) {
  return T(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      g.strokeStyle = `rgba(${dark},${rr(.04, .16).toFixed(3)})`; g.lineWidth = rr(.5, 2.6); g.beginPath();
      const y = RN() * h; g.moveTo(0, y);
      for (let x = 0; x <= w; x += 12) g.lineTo(x, y + Math.sin(x * .04 + i * .8) * rr(1, 4));
      g.stroke();
    }
    for (let i = 0; i < 6; i++) { const cx = RN() * w, cy = RN() * h, rd = rr(7, 13);
      for (let k = 0; k < 5; k++) { const r0 = rd - k * 1.3; if (r0 <= .4) break;
        g.strokeStyle = `rgba(${dark},.18)`; g.lineWidth = 1.1; g.beginPath(); g.ellipse(cx, cy, r0, r0 * .5, rr(0, 3), 0, 6.3); g.stroke(); } }
    for (let i = 0; i < 24; i++) { g.fillStyle = `rgba(${~~rr(62, 96)},${~~rr(86, 120)},${~~rr(48, 72)},${rr(.05, .2).toFixed(2)})`; g.beginPath(); g.ellipse(RN() * w, RN() * h, rr(4, 18), rr(3, 9), rr(0, 3), 0, 6.3); g.fill(); }
    sp(g, w, h, 500, '236,214,182', '46,30,18', .02, .09, 1, 4);
  }, rx, ry);
}
const BP_WOOD = T(256, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 130; i++) { g.strokeStyle = `rgba(${RN() > .5 ? '255,255,255' : '0,0,0'},${rr(.05, .2).toFixed(3)})`; g.lineWidth = rr(.5, 2.2); g.beginPath();
    const y = RN() * h; g.moveTo(0, y); for (let x = 0; x <= w; x += 10) g.lineTo(x, y + Math.sin(x * .05 + i) * 2.4); g.stroke(); }
}, 2, 1, false);
const TX_WD = woodTex('#4a3626', '52,34,20'), TX_WW = woodTex('#6a4c32', '60,38,22'), TX_WG = woodTex('#5a5347', '44,40,32');

const TX_THATCH = T(512, 512, (g, w, h) => {
  g.fillStyle = '#6d5730'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const x = RN() * w, y = RN() * h;
    g.strokeStyle = `rgba(${~~rr(96, 186)},${~~rr(78, 152)},${~~rr(42, 92)},${rr(.1, .4).toFixed(2)})`; g.lineWidth = rr(.6, 2);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2.5, 2.5), y + rr(8, 26)); g.stroke(); }
  for (let r = 0; r < 7; r++) { g.fillStyle = 'rgba(30,22,12,.22)'; g.fillRect(0, (h / 7) * r, w, 5); }
  for (let i = 0; i < 32; i++) { g.fillStyle = `rgba(${~~rr(60, 96)},${~~rr(88, 124)},${~~rr(48, 70)},${rr(.08, .26).toFixed(2)})`; g.beginPath(); g.ellipse(RN() * w, RN() * h, rr(6, 22), rr(4, 12), rr(0, 3), 0, 6.3); g.fill(); }
  sp(g, w, h, 1200, '208,186,140', '32,24,14', .02, .12, 1, 4);
}, 3, 2);
const BP_THATCH = T(256, 256, (g, w, h) => {
  g.fillStyle = '#787878'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) { const x = RN() * w, y = RN() * h;
    g.strokeStyle = `rgba(${RN() > .5 ? '255,255,255' : '0,0,0'},${rr(.1, .4).toFixed(2)})`; g.lineWidth = rr(.6, 2);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2, 2), y + rr(6, 20)); g.stroke(); }
}, 3, 2, false);

const TX_FLAG = T(1024, 1024, (g, w, h) => {
  g.fillStyle = '#2b2f36'; g.fillRect(0, 0, w, h);
  const n = 5, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const jx = rr(-5, 5), jy = rr(-5, 5), v = rr(.8, 1.18);
    g.fillStyle = `rgb(${~~(74 * v)},${~~(74 * v)},${~~(78 * v)})`;
    g.beginPath(); g.moveTo(i * s + 4 + jx, j * s + 4 + jy); g.lineTo(i * s + s - 4 + jx + rr(-3, 3), j * s + 5 + jy);
    g.lineTo(i * s + s - 5 + jx, j * s + s - 4 + jy + rr(-3, 3)); g.lineTo(i * s + 5 + jx + rr(-3, 3), j * s + s - 5 + jy);
    g.closePath(); g.fill();
    for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(16,18,22,${rr(.12, .32).toFixed(2)})`; g.lineWidth = rr(.5, 1.4); g.beginPath();
      let px = i * s + rr(8, s - 8), py = j * s + rr(8, s - 8); g.moveTo(px, py);
      for (let q = 0; q < 4; q++) { px += rr(-15, 15); py += rr(-15, 15); g.lineTo(px, py); } g.stroke(); }
  }
  sp(g, w, h, 2600, '226,232,240', '14,16,20', .02, .09, 1, 4);
  for (let i = 0; i < 80; i++) { g.fillStyle = `rgba(${~~rr(56, 92)},${~~rr(80, 118)},${~~rr(44, 70)},${rr(.08, .3).toFixed(2)})`; g.beginPath(); g.ellipse(RN() * w, RN() * h, rr(4, 16), rr(3, 9), rr(0, 3), 0, 6.3); g.fill(); }
}, 4, 4);
const BP_FLAG = T(512, 512, (g, w, h) => {
  g.fillStyle = '#4c4c4c'; g.fillRect(0, 0, w, h);
  const n = 5, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = ~~rr(180, 226); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6); }
  sp(g, w, h, 1400, '255,255,255', '0,0,0', .05, .2, 1, 5);
}, 4, 4, false);
const RG_FLAG = T(512, 512, (g, w, h) => {
  g.fillStyle = '#9c9c9c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 66; i++) { const cx = RN() * w, cy = RN() * h, rd = rr(18, 82);
    const r = g.createRadialGradient(cx, cy, 0, cx, cy, rd);
    r.addColorStop(0, 'rgba(18,18,18,.85)'); r.addColorStop(.55, 'rgba(72,72,72,.4)'); r.addColorStop(1, 'rgba(156,156,156,0)');
    g.fillStyle = r; g.beginPath(); g.arc(cx, cy, rd, 0, 6.3); g.fill(); }
  sp(g, w, h, 500, '255,255,255', '0,0,0', .03, .14, 2, 10);
}, 4, 4, false);

const TX_DIRT = T(512, 512, (g, w, h) => {
  g.fillStyle = '#33291e'; g.fillRect(0, 0, w, h);
  sp(g, w, h, 6000, '112,94,66', '12,10,7', .02, .12, 1, 4);
  for (let i = 0; i < 40; i++) { const cx = RN() * w, cy = RN() * h, rd = rr(14, 60);
    const r = g.createRadialGradient(cx, cy, 0, cx, cy, rd); r.addColorStop(0, 'rgba(14,12,9,.4)'); r.addColorStop(1, 'rgba(14,12,9,0)');
    g.fillStyle = r; g.beginPath(); g.arc(cx, cy, rd, 0, 6.3); g.fill(); }
  for (let i = 0; i < 130; i++) { g.fillStyle = `rgba(${~~rr(48, 92)},${~~rr(70, 116)},${~~rr(36, 62)},${rr(.08, .32).toFixed(2)})`; g.beginPath(); g.ellipse(RN() * w, RN() * h, rr(5, 22), rr(3, 12), rr(0, 3), 0, 6.3); g.fill(); }
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(${~~rr(96, 148)},${~~rr(92, 140)},${~~rr(84, 128)},${rr(.1, .3).toFixed(2)})`; g.beginPath(); g.arc(RN() * w, RN() * h, rr(1, 3.4), 0, 6.3); g.fill(); }
}, 6, 6);
const BP_DIRT = T(256, 256, (g, w, h) => { g.fillStyle = '#828282'; g.fillRect(0, 0, w, h); sp(g, w, h, 3000, '255,255,255', '0,0,0', .04, .2, 1, 5); }, 6, 6, false);

const TX_ROCK = T(512, 512, (g, w, h) => {
  g.fillStyle = '#5c5f62'; g.fillRect(0, 0, w, h);
  sp(g, w, h, 3600, '178,186,192', '18,20,24', .02, .12, 1, 5);
  for (let i = 0; i < 22; i++) { g.strokeStyle = `rgba(${RN() > .5 ? '196,204,212' : '16,18,22'},${rr(.06, .2).toFixed(2)})`; g.lineWidth = rr(1, 4); g.beginPath();
    const y = RN() * h; g.moveTo(0, y); for (let x = 0; x <= w; x += 20) g.lineTo(x, y + Math.sin(x * .02 + i) * 6); g.stroke(); }

const TX_RUNE = T(1024, 1024, (g, w) => {
  g.clearRect(0, 0, w, w); const C = w / 2; g.translate(C, C);
  const ring = (r, lw, a) => { g.strokeStyle = `rgba(150,214,255,${a})`; g.lineWidth = lw; g.beginPath(); g.arc(0, 0, r, 0, 6.3); g.stroke(); };
  ring(C * .94, 7, .5); ring(C * .88, 3, .32); ring(C * .68, 4, .4); ring(C * .40, 3, .34); ring(C * .16, 5, .44);
  g.strokeStyle = 'rgba(178,226,255,.5)'; g.lineWidth = 6; g.beginPath();
  for (let i = 0; i <= 5; i++) { const p = (i * 2) % 5, a = -Math.PI / 2 + (p * Math.PI * 2) / 5;
    const x = Math.cos(a) * C * .66, y = Math.sin(a) * C * .66; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath(); g.stroke();
  for (let i = 0; i < 44; i++) { const a = (i / 44) * Math.PI * 2; g.save(); g.rotate(a); g.translate(0, -C * .8);
    g.strokeStyle = `rgba(196,232,255,${rr(.3, .75).toFixed(2)})`; g.lineWidth = rr(2.4, 4.4); g.beginPath();
    const k = i % 5;
    if (k === 0) { g.moveTo(-8, -10); g.lineTo(8, 10); g.moveTo(8, -10); g.lineTo(-8, 10); }
    else if (k === 1) { g.moveTo(0, -12); g.lineTo(0, 12); g.moveTo(-7, -4); g.lineTo(7, -4); }
    else if (k === 2) { g.moveTo(-7, 11); g.lineTo(0, -12); g.lineTo(7, 11); }
    else if (k === 3) { g.moveTo(-7, -11); g.lineTo(7, -11); g.lineTo(-7, 11); g.lineTo(7, 11); }
    else g.arc(0, 0, 8, 0, 4.6);
    g.stroke(); g.restore(); }
  for (let i = 0; i < 20; i++) { const a = (i / 20) * Math.PI * 2; g.save(); g.rotate(a); g.translate(0, -C * .28);
    g.fillStyle = `rgba(210,240,255,${rr(.25, .6).toFixed(2)})`; g.fillRect(-3, -7, 6, 14); g.restore(); }
  g.setTransform(1, 0, 0, 1, 0, 0);

function mesh(geo, mat, x, y, z, p = G, s = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = s; m.receiveShadow = true; p.add(m); return m;
}
const box = (w, h, d, m2, x, y, z, p = G, s = true) => mesh(new THREE.BoxGeometry(w, h, d), m2, x, y, z, p, s);
const cyl = (rt, rb, h, m2, x, y, z, p = G, sg = 12, s = true) => mesh(new THREE.CylinderGeometry(rt, rb, h, sg), m2, x, y, z, p, s);
const sph = (r, m2, x, y, z, p = G, sg = 12, s = true) => mesh(new THREE.SphereGeometry(r, sg, Math.max(6, sg >> 1)), m2, x, y, z, p, s);
const cone = (r, h, m2, x, y, z, p = G, sg = 12, s = true) => mesh(new THREE.ConeGeometry(r, h, sg), m2, x, y, z, p, s);
function ground(w, d, m2, x, z, p = G, y = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m2);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; p.add(m); return m;
}
function halo(sx, sy, c, o, x, y, z, p = G) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TX_HALO, color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(sx, sy, 1); s.position.set(x, y, z); p.add(s); return s;
}

/* 小号南瓜灯：一段麻绳绕在枝条上系紧，绳结下垂一截麻绳再吊住南瓜身体
   （dir 为该枝条在树local空间的朝向，用来让绳圈正确套在枝条表面，而不是悬浮穿模） */
function hangPumpkin(parent, x, y, z, s, dir) {
  /* 绳圈：紧贴枝条表面绕一圈，圈面与枝条方向垂直 */
  const tie = mesh(new THREE.TorusGeometry(.052, .014, 5, 10), M.rope, x, y, z, parent);
  tie.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
  /* 垂下的麻绳，始终竖直向下（重力方向），与枝条角度无关 */
  const p = new THREE.Group(); p.position.set(x, y, z); p.rotation.y = rr(0, 6.3); parent.add(p);
  const stemLen = s * .62;
  cyl(.02, .022, stemLen, M.rope, 0, -stemLen / 2, 0, p, 6);
  const bodyY = -stemLen - s * .7;
  /* 南瓜顶部的藤蒂，衔接绳结与瓜身，避免绳子直接插入瓜身产生的穿模感 */
  cyl(.03 * s / .5, .045 * s / .5, .12 * s / .5, M.vine, 0, bodyY + s * .78, 0, p, 6);
  const b = sph(s, M.pumpkin, 0, bodyY, 0, p, 12); b.scale.set(1, .8, 1);
  const gm = std({ color: 0xffc247, emissive: 0xff9c22, emissiveIntensity: 2.2, roughness: .6 });
  [-1, 1].forEach(sg => { const e = cone(s * .13, s * .18, gm, sg * s * .28, bodyY + s * .18, -s * .84, p, 3, false); e.rotation.x = -Math.PI / 2; e.rotation.z = sg * .2; });
  box(s * .56, s * .16, s * .1, gm, 0, bodyY - s * .12, -s * .86, p, false);
  const li = new THREE.PointLight(0xff9c33, 1.4 * s / .5, 2.8, 2.2); li.position.set(0, bodyY + s * .2, -s * .3); p.add(li);
  halo(1.3 * s / .5, 1.3 * s / .5, 0xff9c33, .2, 0, bodyY + s * .1, -s * .4, p);
  return { li, ph: rr(0, 6.3) };
}
/* 树：主枝/二级枝改用「起点→终点」向量搭建，保证每一段都严格连在上一段表面，
   不再各自独立随机旋转导致悬空、错位、"乱指"的诡异感 */
function deadTree(x, z, scale, dry, lanterns = 1) {
  const t = new THREE.Group(); t.position.set(x, 0, z); t.scale.setScalar(scale); t.rotation.y = rr(0, 6.3); G.add(t);
  const trunkH = 3.4, topR = .26, botR = .42;
  const trunk = cyl(topR, botR, trunkH, M.bark, 0, trunkH / 2, 0, t, 9); trunk.rotation.z = rr(-.06, .06);
  const radiusAt = h => botR + (topR - botR) * Math.min(1, Math.max(0, h / trunkH));
  const tipPool = [];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + rr(-.25, .25);
    const hStart = rr(1.3, 2.7), upA = rr(.45, .95), len = rr(1.0, 1.7);
    const r0 = radiusAt(hStart);
    const start = new THREE.Vector3(Math.cos(a) * r0, hStart, Math.sin(a) * r0);
    const dir = new THREE.Vector3(Math.cos(a) * Math.cos(upA), Math.sin(upA), Math.sin(a) * Math.cos(upA)).normalize();
    const end = start.clone().addScaledVector(dir, len);
    const mid = start.clone().add(end).multiplyScalar(.5);
    const br = cyl(.055, .12, start.distanceTo(end), M.bark, mid.x, mid.y, mid.z, t, 6);
    br.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    /* 二级枝：从主枝中段分叉，方向基于主枝方向偏转，而不是另起一套随机角度 */
    for (let k = 0; k < 2; k++) {
      const tFrac = rr(.55, .88);
      const branchPoint = start.clone().lerp(end, tFrac);
      const axis = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a));
      const dir2 = dir.clone().applyAxisAngle(axis, rr(-.9, .9));
      dir2.y += rr(.1, .3); dir2.normalize();
      const len2 = len * rr(.45, .65);
      const end2 = branchPoint.clone().addScaledVector(dir2, len2);
      const mid2 = branchPoint.clone().add(end2).multiplyScalar(.5);
      const b2 = cyl(.028, .055, branchPoint.distanceTo(end2), M.bark, mid2.x, mid2.y, mid2.z, t, 5);
      b2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir2);
      tipPool.push({ pt: end2, dir: dir2.clone() });
      /* 叶簇：3~4 片叶子紧贴枝端叠放，朝向大体一致，拼出一小丛树叶而非散指的单片 */
      if (!dry) {
        const leafN = rr(0, 1) > .5 ? 4 : 3;
        for (let q = 0; q < leafN; q++) {
          const off = end2.clone().addScaledVector(dir2, rr(-.05, .12)).add(new THREE.Vector3(rr(-.1, .1), rr(-.06, .12), rr(-.1, .1)));
          const lf = mesh(new THREE.PlaneGeometry(rr(.28, .4), rr(.28, .4)), M.leaf, off.x, off.y, off.z, t);
          lf.rotation.set(-.5 + rr(-.3, .3), rr(0, 6.3), rr(-.3, .3));
        }
      }
    }
  }
  /* 树根 */
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2;
    const rt = cyl(.09, .16, .7, M.bark, Math.cos(a) * .34, .12, Math.sin(a) * .34, t, 5);
    rt.rotation.set(Math.sin(a) * 1.25, 0, -Math.cos(a) * 1.25); }
  /* 南瓜灯挂在二级枝末端 */
  for (let i = 0; i < lanterns && tipPool.length; i++) {
    const idx = Math.floor(rr(0, tipPool.length));
    const tp = tipPool.splice(idx, 1)[0];
    treePumpkins.push(hangPumpkin(t, tp.pt.x, tp.pt.y - .015, tp.pt.z, rr(.22, .3), tp.dir));
  }
  trees.push(t); return t;
}

function grassTuft(x, z, sc = 1) {
  for (let i = 0; i < 3; i++) {
    const h = rr(.42, .72) * sc, w = h * .62;
    const pl = mesh(new THREE.PlaneGeometry(w, h), M.grass, x, h / 2, z, G, false);
    pl.rotation.y = i * (Math.PI / 3) + rr(-.15, .15);
  }
}

/* 场地边缘过渡环：避开广场、小屋、栅栏、干草堆、水桶与已有的蕨类/蘑菇丛/枯树，
   把方形主台边缘一直到外圈远景森林之间的空地都铺上草丛，让方台不再是生硬地"悬"在树林中间 */
{
  const AVOID = [
    { x: PZX, z: PZZ, r: PZR + 1.5 },
    { x: -5.5, z: 5.0, r: 4.3 },      // 小屋
    { x: 8.0, z: 7.2, r: 2.3 },       // 干草堆
    { x: 5.6, z: 6.4, r: 1.6 },       // 手推车
    { x: -3.5, z: -0.3, r: 1.3 },     // 水桶
    { x: -4.9, z: -5.3, r: 3.3 },     // 栅栏1（中点+半长）
    { x: 8.9, z: 4.8, r: 3.5 },       // 栅栏2（中点+半长）
    { x: -3.9, z: 2.6, r: 1.0 }, { x: -7.9, z: 2.4, r: 1.0 }, { x: 6.4, z: 5.6, r: 1.0 },
    { x: -1.2, z: -6.4, r: 1.0 }, { x: 8.2, z: -3.2, r: 1.0 }, // 蘑菇丛
    { x: -9.0, z: 3.6, r: 1.3 }, { x: -6.6, z: -3.4, r: 1.3 }, { x: 7.8, z: 1.2, r: 1.3 },
    { x: 3.0, z: 7.4, r: 1.3 }, { x: -3.4, z: -7.6, r: 1.3 }, { x: 9.0, z: 6.4, r: 1.3 }, { x: -8.4, z: 7.0, r: 1.3 }, // 蕨类丛
    { x: -8.6, z: -1.2, r: 1.8 }, { x: 7.4, z: 4.6, r: 1.8 }, { x: -2.2, z: 8.6, r: 1.8 }, // 枯树根部（已有专属草丛）
  ];
  const tooClose = (x, z) => AVOID.some(o => Math.hypot(x - o.x, z - o.z) < o.r);
  /* 内圈：方台边缘附近，密度较高，紧贴装饰物外沿 */
  let placed = 0, tries = 0;
  while (placed < 90 && tries < 700) {
    tries++;
    const a = rr(0, 6.3), r = rr(8.4, 11.6);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (tooClose(x, z)) continue;
    grassTuft(x, z, rr(.8, 1.35));
    placed++;
  }
  /* 外圈：一路延伸到远景森林剪影脚下，盖住方台之外原本空荡的地面 */
  placed = 0; tries = 0;
  while (placed < 150 && tries < 1000) {
    tries++;
    const a = rr(0, 6.3), r = rr(11.2, 22.2);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (tooClose(x, z)) continue;
    grassTuft(x, z, rr(.9, 1.6));
    placed++;
  }
}

/* ---- GameManager：计时器状态机 + 加成 + 家具存档（对应 Godot GameManager.gd） ---- */
const GM = (() => {
  const SAVE_KEY = 'witch_idle_web_save_v1';
  const State = { IDLE: 0, WORK: 1, SHORT_BREAK: 2, LONG_BREAK: 3, PAUSED: 4 };
  const FURNITURE_NAMES = { lantern: '灯笼', small_tree: '小树', mushroom: '蘑菇丛', bench: '长椅', pumpkin: '南瓜灯', big_tree: '大树', house: '小房子' };
  const gm = {
    State, FURNITURE_NAMES,
    state: State.IDLE, stateBeforePause: State.IDLE,
    workDuration: 25 * 60, shortBreakDuration: 5 * 60, longBreakDuration: 15 * 60,
    sessionsBeforeLongBreak: 4,
    remaining: 25 * 60, totalDuration: 25 * 60,
    sessionCount: 0, sessionsSinceLongBreak: 0,
    focusPoints: 0,
    activeBuffs: {},
    buildRadiusBase: 12.0, buildRadiusMax: 19.0, buildRadiusPerSession: 0.9, sessionsForMaxRadius: 8,
    placedItems: [],
    decorMode: false, selectedFurniture: '', deleteMode: false,
    _listeners: {},
    on(evt, fn) { (this._listeners[evt] = this._listeners[evt] || []).push(fn); },
    emit(evt, ...a) { (this._listeners[evt] || []).forEach(fn => fn(...a)); },
    getBuildRadius() { const steps = Math.min(this.sessionCount, this.sessionsForMaxRadius); return Math.min(this.buildRadiusMax, this.buildRadiusBase + this.buildRadiusPerSession * steps); },
    getTotalBuff() { let b = 0; for (const k in this.activeBuffs) b += this.activeBuffs[k]; return b; },
    startTimer() { if (this.state === State.IDLE) { this.state = State.WORK; this.totalDuration = this.workDuration; this.remaining = this.workDuration; this.emit('state'); this.emit('time', this.remaining, this.totalDuration); } },
    togglePause() { if (this.state === State.PAUSED) { this.state = this.stateBeforePause; this.emit('state'); } else if (this.state !== State.IDLE) { this.stateBeforePause = this.state; this.state = State.PAUSED; this.emit('state'); } },
    resetTimer() { this.state = State.IDLE; this.remaining = this.workDuration; this.totalDuration = this.workDuration; this.emit('state'); this.emit('time', this.remaining, this.totalDuration); },
    setPreset(w, s, l) {
      this.workDuration = w * 60; this.shortBreakDuration = s * 60; this.longBreakDuration = l * 60;
      if (this.state === State.IDLE) { this.totalDuration = this.workDuration; this.remaining = this.workDuration; this.emit('time', this.remaining, this.totalDuration); }
    },
    advanceState() {
      if (this.state === State.WORK) {
        this.sessionCount++; this.sessionsSinceLongBreak++;
        this.emit('buildRadius', this.getBuildRadius());
        this.emit('sessionCompleted', this.sessionCount);
        if (this.sessionsSinceLongBreak >= this.sessionsBeforeLongBreak) { this.sessionsSinceLongBreak = 0; this.state = State.LONG_BREAK; this.totalDuration = this.longBreakDuration; }
        else { this.state = State.SHORT_BREAK; this.totalDuration = this.shortBreakDuration; }
        this.remaining = this.totalDuration; this.save();
      } else if (this.state === State.SHORT_BREAK || this.state === State.LONG_BREAK) {
        this.state = State.WORK; this.totalDuration = this.workDuration; this.remaining = this.workDuration;
      }
      this.emit('state'); this.emit('time', this.remaining, this.totalDuration);
    },
    setBuff(id, ratio) { this.activeBuffs[id] = ratio; this.emit('buff', this.getTotalBuff()); },
    clearBuff(id) { if (id in this.activeBuffs) { delete this.activeBuffs[id]; this.emit('buff', this.getTotalBuff()); } },
    placeFurniture(type, pos, ry) {
      if (!(type in FURNITURE_NAMES)) return false;
      if (Math.hypot(pos.x, pos.z) > this.getBuildRadius()) return false;
      this.placedItems.push({ type, x: pos.x, z: pos.z, ry });
      this.emit('placedItems'); this.save(); return true;
    },
    removeFurniture(idx) {
      if (idx < 0 || idx >= this.placedItems.length) return false;
      this.placedItems.splice(idx, 1);
      this.emit('placedItems'); this.save(); return true;
    },
    update(dt) {
      if (this.state === State.WORK || this.state === State.SHORT_BREAK || this.state === State.LONG_BREAK) {
        this.remaining = Math.max(0, this.remaining - dt);
        this.emit('time', this.remaining, this.totalDuration);
        if (this.state === State.WORK) { this.focusPoints += dt * (1 + this.getTotalBuff()); this.emit('focus', this.focusPoints); }
        if (this.remaining <= 0) this.advanceState();
      }
    },
    save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ sessionCount: this.sessionCount, focusPoints: this.focusPoints, placedItems: this.placedItems })); } catch (e) { } },
    load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
        const d = JSON.parse(raw);
        this.sessionCount = d.sessionCount || 0; this.focusPoints = d.focusPoints || 0;
        this.placedItems = Array.isArray(d.placedItems) ? d.placedItems : [];
      } catch (e) { }
    },
  };
  gm.load();
  return gm;
})();
addEventListener('beforeunload', () => GM.save());
setInterval(() => GM.save(), 15000);

/* ---- 冒字特效（对应 Godot FloatingText.gd，用 DOM 元素跟随世界坐标投影） ---- */
const floatingTexts = [];
function spawnFloatingText(worldPos, text, colorCss) {
  const el = document.createElement('div');
  el.className = 'float-text'; el.textContent = text; el.style.color = colorCss;
  document.body.appendChild(el);
  floatingTexts.push({ el, base: worldPos.clone(), start: performance.now(), dur: 1200 });
}
function updateFloatingTexts() {
  const now = performance.now();
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i], k = (now - f.start) / f.dur;
    if (k >= 1) { f.el.remove(); floatingTexts.splice(i, 1); continue; }
    const p = f.base.clone(); p.y += k * 1.0;
    const proj = p.project(camera);
    f.el.style.left = ((proj.x * .5 + .5) * innerWidth) + 'px';
    f.el.style.top = ((1 - (proj.y * .5 + .5)) * innerHeight) + 'px';
    f.el.style.opacity = k < .3 ? 1 : Math.max(0, 1 - (k - .3) / .7);
  }
}

/* ---- 黑猫：点击地面行走过去 + 骨骼动画（idle/walk/run） ---- */
const CAT = {
  root: null, mixer: null, actions: {}, current: null,
  position: new THREE.Vector3(1.4, 0, 2.4), target: new THREE.Vector3(1.4, 0, 2.4),
  moving: false, curSpeed: 0, maxSpeed: 1.0, accel: 2.6, decel: 5.0, turnSpeed: 9.0, arriveDist: .08,
  facingYaw: 0, yawOffset: 0,
  feet: [], groundY: 0,
  buffZones: [], activeZoneIds: {},
};
const _catFootVec = new THREE.Vector3();
const catLoader = new GLTFLoader();
const CAT_FOOT_BONE_NAMES = ['leg_front_left_toe', 'leg_front_right_toe', 'leg_hind_left_toe', 'leg_hind_right_toe'];
function loadCat() {
  catLoader.load('assets/cat/rig.glb', (gltf) => {
    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const targetHeight = 0.4;
    const scale = size.y > 0.0001 ? targetHeight / size.y : 1;
    root.scale.setScalar(scale);
    root.position.y -= box.min.y * scale;
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material) o.material.envMapIntensity = 1.1; } });
    root.position.set(CAT.position.x, 0, CAT.position.z);
    G.add(root);
    CAT.root = root;
    /* 脚部骨骼：用于每帧动态贴地，消除因绑定姿势与走/跑动画姿态差异造成的穿模与"一跳一跳"抖动 */
    CAT.feet = CAT_FOOT_BONE_NAMES.map(n => root.getObjectByName(n)).filter(Boolean);
    CAT.mixer = new THREE.AnimationMixer(root);
    ['idle', 'walk', 'run'].forEach(key => {
      catLoader.load(`assets/cat/${key}.glb`, (g2) => {
        const clip = g2.animations && g2.animations[0]; if (!clip) return;
        const action = CAT.mixer.clipAction(clip, root);
        CAT.actions[key] = action;
        if (key === 'idle') { action.play(); CAT.current = action; }
      });
    });
    const glow = new THREE.PointLight(0xffebc8, .22, 1.6, 2.0); glow.position.set(0, .26, 0); root.add(glow);
  });
}
function catMoveTo(x, z) { CAT.target.set(x, 0, z); CAT.moving = true; }
function catCrossfadeTo(key, dur = .25) {
  const next = CAT.actions[key]; if (!next || CAT.current === next) return;
  next.reset().play();
  if (CAT.current) CAT.current.crossFadeTo(next, dur, false); else next.fadeIn(dur);
  CAT.current = next;
}
function updateCat(dt) {
  if (!CAT.root) return;
  const dx = CAT.target.x - CAT.position.x, dz = CAT.target.z - CAT.position.z, dist = Math.hypot(dx, dz);
  if (CAT.moving && dist > CAT.arriveDist) {
    const dirX = dx / Math.max(dist, 1e-4), dirZ = dz / Math.max(dist, 1e-4);
    CAT.curSpeed = Math.min(CAT.maxSpeed, CAT.curSpeed + CAT.accel * dt);
    const step = Math.min(CAT.curSpeed * dt, dist);
    CAT.position.x += dirX * step; CAT.position.z += dirZ * step;
    const desiredYaw = Math.atan2(dirX, dirZ);
    let diff = desiredYaw - CAT.facingYaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    CAT.facingYaw += diff * Math.min(1, CAT.turnSpeed * dt);
  } else {
    CAT.moving = false;
    CAT.curSpeed = Math.max(0, CAT.curSpeed - CAT.decel * dt);
  }
  CAT.root.position.set(CAT.position.x, 0, CAT.position.z);
  CAT.root.rotation.y = CAT.facingYaw + CAT.yawOffset;
  const speedRatio = Math.min(1, CAT.curSpeed / CAT.maxSpeed);
  if (CAT.mixer) {
    CAT.mixer.update(dt);
    if (speedRatio > .02) catCrossfadeTo('walk');
    else catCrossfadeTo('idle');
    if (CAT.current) CAT.current.timeScale = speedRatio > .02 ? (.85 + speedRatio * .5) : 1.0;
  }
  /* 动态贴地：每帧取当前姿态下最低的脚部骨骼世界高度，把整只猫抬/沉到刚好贴地，
     消除走/跑动画姿态与绑定姿势高度不一致造成的穿地/悬空，也顺带消掉视觉上的"一跳一跳" */
  if (CAT.feet.length) {
    CAT.root.updateMatrixWorld(true);
    let minY = Infinity;
    for (let i = 0; i < CAT.feet.length; i++) {
      CAT.feet[i].getWorldPosition(_catFootVec);
      if (_catFootVec.y < minY) minY = _catFootVec.y;
    }
    if (isFinite(minY)) CAT.root.position.y += (CAT.groundY - minY);
  }
  checkCatBuffs();
}
function checkCatBuffs() {
  CAT.buffZones.forEach(zone => {
    const d = Math.hypot(CAT.position.x - zone.pos.x, CAT.position.z - zone.pos.z);
    const active = zone.id in CAT.activeZoneIds;
    if (d <= zone.radius && !active) {
      CAT.activeZoneIds[zone.id] = true;
      GM.setBuff(zone.id, zone.bonus);
      spawnFloatingText(new THREE.Vector3(CAT.position.x, .85, CAT.position.z), zone.label, zone.color);
    } else if (d > zone.radius && active) {
      delete CAT.activeZoneIds[zone.id];
      GM.clearBuff(zone.id);
    }
  });
}

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  GM.update(dt);
  updateCat(dt);
  updateGhost();
  updateFloatingTexts();

  /* 篝火：多频叠加，克制跳动 */
  const fk = .82 + .1 * Math.sin(t * 7.3) + .06 * Math.sin(t * 13.1 + 1.4) + .04 * Math.sin(t * 3.1);
  fireLight.intensity = 8.2 * fk;
  fireHalo.material.opacity = .24 * fk;
  fireRefl.material.opacity = .13 * fk;
  flames.forEach((f, i) => {
    const k = .82 + .22 * Math.sin(t * (5.2 + i * .9) + f.userData.ph);
    f.scale.setScalar(k);
    f.position.y = f.userData.base + .06 * Math.sin(t * (3.4 + i * .6) + f.userData.ph);
    f.material.emissiveIntensity = 2.1 + .7 * k;
  });
  /* 火星上升 */
  const sa = spkGeo.attributes.position.array;
  spkData.forEach((d, i) => {
    d.t += dt * d.sp * .32;
    if (d.t > 1) { d.t = 0; d.ox = rr(-.5, .5); d.oz = rr(-.5, .5); }
    const y = .4 + d.t * 4.2;
    sa[i * 3] = PZX + d.ox * (1 + d.t * 1.6) + Math.sin(t * 1.6 + d.sw) * .3 * d.t;
    sa[i * 3 + 1] = y;
    sa[i * 3 + 2] = PZZ + d.oz * (1 + d.t * 1.6) + Math.cos(t * 1.4 + d.sw) * .3 * d.t;
  });
  spkGeo.attributes.position.needsUpdate = true;
  sparks.material.opacity = .85;

  /* 火把 */
  torches.forEach(o => {
    const k = .84 + .14 * Math.sin(t * 6.1 + o.ph) + .06 * Math.sin(t * 11.7 + o.ph * 2);
    o.li.intensity = 3.0 * k;
    o.fl.scale.setScalar(k);
    o.fl.material.emissiveIntensity = 2.3 + .6 * k;
  });
  /* 烛火 */
  (window.__CANDLES || []).forEach(o => {
    const k = .86 + .12 * Math.sin(t * 8.4 + o.ph) + .05 * Math.sin(t * 15.2);
    o.li.intensity = 1.5 * k;
    o.fl.scale.set(k, .9 + .25 * k, k);
  });
  /* 南瓜灯：极缓呼吸 */
  pumpkins.forEach(o => { o.li.intensity = 1.5 + .28 * Math.sin(t * 1.15 + o.ph); });

  /* 坩埚：荧光脉动 + 水汽上升 */
  const bk = .8 + .2 * Math.sin(t * 1.5);
  cauldLight.intensity = 2.8 + .8 * bk;
  M.brew.emissiveIntensity = 1.4 + .5 * bk;
  if (window.__BREW) window.__BREW.position.y = (HB + .02) + .8 + .012 * Math.sin(t * 1.9);
  steams.forEach(s => {
    s.userData.t += dt * s.userData.sp * .34;
    if (s.userData.t > 1) { s.userData.t = 0; s.userData.ox = rr(-.14, .14); s.userData.oz = rr(-.14, .14); }
    const k = s.userData.t;
    s.position.set(.55 + s.userData.ox * (1 + k * 2) + Math.sin(t + k * 4) * .1, (HB + .02) + .95 + k * 1.5, .1 + s.userData.oz * (1 + k * 2));

  /* 萤火虫缓慢漂浮 */
  const fa = ffGeo.attributes.position.array;
  ffData.forEach((d, i) => {
    fa[i * 3] = d.x + Math.sin(t * d.sp + d.px) * d.sx * 2.2;
    fa[i * 3 + 1] = d.y + Math.sin(t * d.sp * .8 + d.py) * d.sy;
    fa[i * 3 + 2] = d.z + Math.cos(t * d.sp * .9 + d.pz) * d.sz * 2.2;
  });
  ffGeo.attributes.position.needsUpdate = true;
  fireflies.material.opacity = .68 + .22 * Math.sin(t * 1.3);

  /* 薄雾缓缓流动 */
  fogPlanes.forEach(f => {
    f.position.x += dt * f.userData.sp * .22;
    if (f.position.x > 11) f.position.x = -11;
    f.position.y = f.userData.y + .12 * Math.sin(t * .35 + f.userData.ph);
    f.lookAt(camera.position.x, f.position.y, camera.position.z);
  });

  /* 树枝微风摆动 */
  trees.forEach((tr, i) => {
    tr.rotation.z = Math.sin(t * .42 + i * 1.7) * .012;
    tr.rotation.x = Math.cos(t * .33 + i * .9) * .009;
  });
  /* 绞索轻晃 */
  if (window.__NOOSE) window.__NOOSE.rotation.z = Math.sin(t * .55) * .07;

  /* 魔法阵呼吸 */
  M.rune.opacity = .38 + .13 * Math.sin(t * .75);
  RUNE.rotation.z += dt * .018;

  controls.update();
  composer.render();
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
